name: Release Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare default config
        run: |
          bash tools/prepare_config.sh

      - name: Build web assets
        run: |
          python tools/embed_web.py

      - name: Build firmware
        run: |
          pio run -e geiger

      - name: Package binaries
        run: |
          mkdir -p binaries/geiger
          cp .pio/build/geiger/firmware.bin binaries/geiger/ || true
          cp .pio/build/geiger/firmware.elf binaries/geiger/ || true
          ls -lh binaries/geiger

      - name: Publish release assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            binaries/geiger/*
